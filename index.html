<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eeeee5"><title>Fold & Snip</title><link rel="stylesheet" href="style.css"></head><body><main>
<header><a class="brand" href="./" aria-label="Fold and Snip home"><span>✳</span> Fold <i>&</i> Snip</a></header>
<section class="studio" aria-label="Paper cutting studio"><div class="topbar"><div class="presets" role="group" aria-label="Paper and fold pattern"><button class="preset selected" data-preset="snow" aria-pressed="true" aria-label="Hexagon paper, 30 degree folded wedge, sixfold repeat" title="Hexagon · 30° folded wedge · sixfold repeat"><span class="preset-diagram" aria-hidden="true"></span><span>Hexagon</span></button><button class="preset" data-preset="rosette" aria-pressed="false" aria-label="Octagon paper, 22.5 degree folded wedge, eightfold repeat" title="Octagon · 22.5° folded wedge · eightfold repeat"><span class="preset-diagram" aria-hidden="true"></span><span>Octagon</span></button><button class="preset" data-preset="webb" aria-pressed="false" aria-label="Webb template, 30 degree folded wedge" title="Webb template · 30° folded wedge"><span class="preset-diagram" aria-hidden="true"></span><span>Webb</span></button></div>
<div class="paper-options" role="group" aria-label="Paper colour"><button class="swatch active" data-color="#eee4cd" style="--swatch:#eee4cd" aria-label="Ivory paper" aria-pressed="true" title="Ivory"></button><button class="swatch" data-color="#c3c9ea" style="--swatch:#c3c9ea" aria-label="Lilac paper" aria-pressed="false" title="Lilac"></button><button class="swatch" data-color="#b6cbb6" style="--swatch:#b6cbb6" aria-label="Sage paper" aria-pressed="false" title="Sage"></button><button class="swatch" data-color="#ebcb85" style="--swatch:#ebcb85" aria-label="Honey paper" aria-pressed="false" title="Honey"></button></div>
<div class="cut-tools" role="group" aria-label="Scissors"><button id="quickMode" aria-label="Quick V snip" title="Quick V snip · drag inward from a marked edge" aria-pressed="true"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 7 16 25 27 7"/></svg><span>V snip</span></button><button id="angularMode" aria-label="Angular cut" title="Angular cut · marked edge, corners, marked edge" aria-pressed="false"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 6 12 22 22 15 27 27"/><circle cx="5" cy="6" r="2"/><circle cx="12" cy="22" r="2"/><circle cx="22" cy="15" r="2"/><circle cx="27" cy="27" r="2"/></svg><span>Shape</span></button></div><div id="source" class="source"></div></div>
<div class="workarea"><div class="stage" id="stage"><canvas id="paper" tabindex="0" role="img" aria-label="Folded paper. Drag inward from a marked edge to snip."></canvas><div id="canvasMessage" class="sr-only" aria-hidden="true"></div></div>
<div class="toolbar"><div class="history"><button id="undo" disabled aria-label="Undo last cut" title="Undo">↶<span>Undo</span></button><button id="reset" aria-label="Reset current paper" title="New paper">↻<span>Reset</span></button><span id="cutCount" aria-label="0 cuts">0</span></div><div class="draft-actions" hidden><button id="backPoint" aria-label="Back one point" title="Back one point">↶<span>Point</span></button><button id="cancelCut" aria-label="Cancel cut" title="Cancel">×<span>Cancel</span></button><button id="commitCut" aria-label="Cut piece" title="Cut piece">✂<span>Cut</span></button></div><button id="guided" aria-label="Try a guided snip" title="Try a guided snip">✧<span>Try</span></button><button id="reveal" class="primary" aria-label="Reveal pattern" title="Reveal pattern"><span class="action-label">Reveal</span></button></div>
<p id="status" class="sr-only" role="status" aria-live="polite"></p></div></section></main><script src="webb-data.js"></script><script src="geometry.js"></script><script src="fold-model.js"></script><script src="app.js"></script></body></html>
