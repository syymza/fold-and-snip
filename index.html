<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eeeee5"><title>Fold & Snip</title><link rel="stylesheet" href="style.css"></head><body><main>
<header><a class="brand" href="./" aria-label="Fold and Snip home"><span>✳</span> Fold <i>&</i> Snip</a></header>
<section class="studio" aria-label="Paper cutting studio"><div class="topbar"><div class="presets" role="group" aria-label="Folding pattern"><button class="preset selected" data-preset="snow" aria-pressed="true" aria-label="Snow flower, six points" title="Snow flower · six points">❋</button><button class="preset" data-preset="rosette" aria-pressed="false" aria-label="Garden rosette, eight points" title="Garden rosette · eight points">✺</button><button class="preset" data-preset="webb" aria-pressed="false" aria-label="A little Webb, NASA template study" title="A little Webb · NASA template study">⬡</button></div>
<div class="paper-options" role="group" aria-label="Paper colour"><button class="swatch active" data-color="#f2b8aa" style="--swatch:#f2b8aa" aria-label="Peach paper" aria-pressed="true" title="Peach"></button><button class="swatch" data-color="#c3c9ea" style="--swatch:#c3c9ea" aria-label="Lilac paper" aria-pressed="false" title="Lilac"></button><button class="swatch" data-color="#b6cbb6" style="--swatch:#b6cbb6" aria-label="Sage paper" aria-pressed="false" title="Sage"></button><button class="swatch" data-color="#ebcb85" style="--swatch:#ebcb85" aria-label="Honey paper" aria-pressed="false" title="Honey"></button></div>
<div class="cut-tools" role="group" aria-label="Scissors"><button id="quickMode" aria-label="Quick V snip" title="Quick V snip · drag inward from a green edge" aria-pressed="true"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 7 16 25 27 7"/></svg></button><button id="angularMode" aria-label="Angular cut" title="Angular cut · green edge, corners, green edge" aria-pressed="false"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 6 12 22 22 15 27 27"/><circle cx="5" cy="6" r="2"/><circle cx="12" cy="22" r="2"/><circle cx="22" cy="15" r="2"/><circle cx="27" cy="27" r="2"/></svg></button></div><div id="source" class="source"></div></div>
<div class="workarea"><div class="stage" id="stage"><canvas id="paper" tabindex="0" role="img" aria-label="Folded paper. Drag inward from a green edge to snip."></canvas><div id="canvasMessage" class="sr-only" aria-hidden="true"></div></div>
<div class="toolbar"><div class="history"><button id="undo" disabled aria-label="Undo last cut" title="Undo">↶</button><button id="reset" aria-label="Reset current paper" title="New paper">↻</button><span id="cutCount" aria-label="0 cuts">0</span></div><div class="draft-actions" hidden><button id="backPoint" aria-label="Back one point" title="Back one point">↶·</button><button id="cancelCut" aria-label="Cancel cut" title="Cancel">×</button><button id="commitCut" aria-label="Cut piece" title="Cut piece">✂</button></div><button id="guided" aria-label="Try a guided snip" title="Try a guided snip">✧</button><button id="reveal" class="primary" aria-label="Reveal pattern" title="Reveal pattern"><svg viewBox="0 0 48 32" aria-hidden="true"><path d="M3 25 3 7l12 9-12 9M19 16h12m-5-5 5 5-5 5M37 8v16m-7-12 14 8m-14 0 14-8"/></svg></button></div>
<p id="status" class="sr-only" role="status" aria-live="polite"></p></div></section></main><script src="webb-data.js"></script><script src="geometry.js"></script><script src="fold-model.js"></script><script src="app.js"></script></body></html>
