<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eeeee5"><title>Fold & Snip</title><link rel="stylesheet" href="style.css"></head><body><main>
<header><a class="brand" href="./" aria-label="Fold and Snip home"><svg class="brand-logo" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><path d="M5 4H20L27 11V28H5V23L10 20L5 17Z" fill="#eee4cd"/><path d="M5 4H20L27 11V28H5V23L10 20L5 17Z M20 4V11H27" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg> Fold <i>&</i> Snip</a><div id="source" class="source"><a target="_blank" rel="noopener" href="https://science.nasa.gov/asset/webb/webb-mirror-paper-snowflake-activity/" title="Inspiration: NASA’s Webb paper snowflake activity. NASA, ESA, CSA, Leah Hustak (STScI). Independent adaptation; no endorsement. Hexagon, Octagon, Square and Circle are original paper outlines." aria-label="Inspired by NASA’s Webb paper snowflake activity. Source credits: NASA, ESA, CSA, Leah Hustak, STScI. Independent adaptation; no endorsement. Hexagon, Octagon, Square and Circle are original paper outlines.">Inspired by NASA</a></div></header>
<section class="studio" aria-label="Paper cutting studio"><div class="topbar"><div class="presets" role="group" aria-label="Paper and fold pattern"><button class="preset selected" data-preset="snow" aria-pressed="true" aria-label="Hexagon paper, 30 degree folded wedge, sixfold repeat" title="Hexagon · 30° folded wedge · sixfold repeat"><span class="preset-diagram" aria-hidden="true"></span><span>Hexagon</span></button><button class="preset" data-preset="rosette" aria-pressed="false" aria-label="Octagon paper, 22.5 degree folded wedge, eightfold repeat" title="Octagon · 22.5° folded wedge · eightfold repeat"><span class="preset-diagram" aria-hidden="true"></span><span>Octagon</span></button><button class="preset" data-preset="webb" aria-pressed="false" aria-label="Webb template, 30 degree folded wedge" title="Webb template · 30° folded wedge"><span class="preset-diagram" aria-hidden="true"></span><span>Webb</span></button><button class="preset" data-preset="square" aria-pressed="false" aria-label="Square paper, 45 degree folded wedge, fourfold repeat" title="Square · 45° folded wedge · fourfold repeat"><span class="preset-diagram" aria-hidden="true"></span><span>Square</span></button><button class="preset" data-preset="circle" aria-pressed="false" aria-label="Circle paper, 30 degree folded sector, sixfold repeat" title="Circle · 30° folded sector · sixfold repeat"><span class="preset-diagram" aria-hidden="true"></span><span>Circle</span></button></div>
<div class="paper-options" role="group" aria-label="Paper colour"><button class="swatch active" data-color="#eee4cd" style="--swatch:#eee4cd" aria-label="Ivory paper" aria-pressed="true" title="Ivory"></button><button class="swatch" data-color="#c3c9ea" style="--swatch:#c3c9ea" aria-label="Lilac paper" aria-pressed="false" title="Lilac"></button><button class="swatch" data-color="#b6cbb6" style="--swatch:#b6cbb6" aria-label="Sage paper" aria-pressed="false" title="Sage"></button><button class="swatch" data-color="#ebcb85" style="--swatch:#ebcb85" aria-label="Honey paper" aria-pressed="false" title="Honey"></button></div>
<div class="cut-tools" role="group" aria-label="Scissors"><button id="quickMode" aria-label="Quick V snip" title="Quick V snip · drag inward from a marked edge" aria-pressed="true"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 7 16 25 27 7"/></svg><span>V snip</span></button><button id="angularMode" aria-label="Angular cut" title="Angular cut · marked edge, corners, marked edge" aria-pressed="false"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 6 12 22 22 15 27 27"/><circle cx="5" cy="6" r="2"/><circle cx="12" cy="22" r="2"/><circle cx="22" cy="15" r="2"/><circle cx="27" cy="27" r="2"/></svg><span>Shape</span></button></div></div>
<div class="workarea"><div class="stage" id="stage"><canvas id="paper" tabindex="0" role="img" aria-label="Folded paper. Drag inward from a marked edge to snip."></canvas><div id="canvasMessage" class="sr-only" aria-hidden="true"></div></div>
<div class="toolbar"><div class="history"><button id="undo" disabled aria-label="Undo last cut" title="Undo"><svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m8 4-5 5 5 5M3 9h10a7 7 0 0 1 0 14"/></svg><span>Undo</span></button><button id="reset" aria-label="Reset current paper" title="New paper"><svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 10a8 8 0 1 0 .2 5M20 4v6h-6"/></svg><span>Reset</span></button><span id="cutCount" aria-label="0 cuts">0</span></div><div class="draft-actions" hidden><button id="backPoint" aria-label="Back one point" title="Back one point"><svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m8 4-5 5 5 5M3 9h10a7 7 0 0 1 0 14"/></svg><span>Point</span></button><button id="cancelCut" aria-label="Cancel cut" title="Cancel"><svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m6 6 12 12M18 6 6 18"/></svg><span>Cancel</span></button><button id="commitCut" aria-label="Cut piece" title="Cut piece"><svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="5" cy="6" r="3"/><circle cx="5" cy="18" r="3"/><path d="m7.5 7.5 13 12M7.5 16.5l13-12"/></svg><span>Cut</span></button></div><button id="guided" aria-label="Try a guided snip" title="Try a guided snip"><svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 3h14v6l-5 3 5 3v6H5Z"/></svg><span>Try</span></button><button id="reveal" class="primary" aria-label="Reveal pattern" title="Reveal pattern"><span class="action-label">Reveal</span></button></div>
<p id="status" class="sr-only" role="status" aria-live="polite"></p></div></section></main><script src="webb-data.js"></script><script src="geometry.js"></script><script src="fold-model.js"></script><script src="app.js"></script></body></html>
